<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
*{ margin: 0; padding: 0; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; box-sizing: border-box;}

body{ background-color: rgb(175, 129, 173);}

.container{
    width: 400px; padding: 25px 35px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: #fff; border-radius: 10px;
}

.container p{
    font-weight: 600; font-size: 18px; margin-bottom: 8px;
}
.container input{
    width: 100%; height: 50px;border: 1px solid #494ee0; outline: 0; padding: 10px; margin: 10px 0 20px; border-radius: 5px;
}

.container button{
width: 100%;height: 50px;background: #494eea; color: white; border: 0; border-radius: 5px; box-shadow: 0 10px 10px rgba(0,0,0.1);
cursor: pointer; margin: 20px 0; font-weight: 500; font-size: 15px;
}

.container button:hover{
    background-color: darkblue;
}

#qrBox{ width: 200px; border-radius: 5px; max-height: 0; overflow: hidden;  transition: max-height 1s;}

#qrBox img{ width: 100%;padding: 10px;}

#qrBox.show-img{ max-height: 300px; margin: 20px auto; border: 2px solid #d1d1d1;}

.error{
    animation: shake 0.1s linear 10;
}

@keyframes shake{
     0% { transform: translateX(0);}
     25% { transform: translateX(-2px);}
     50% { transform: translateX(0);}
     75% { transform: translateX(2px);}
     100% { transform: translateX(0);}
}
    </style>
</head>
<body>
    <!--  QR GENRRATOR -->
<div class="container">
    <p>Enter your text or URL</p>
    <input id="qrText" type="text" placeholder="Text or URL">

    <div id="qrBox">
        <img src="" alt="QrCode" id="qrImage">
    </div>
    <button onclick="GenerateQr()">Generate Qr code</button>
</div>

    <script>


    
//Create variable
  let qrBox = document.getElementById("qrBox");
  let qrImage = document.getElementById("qrImage");
  let qrText = document.getElementById("qrText");


        //Make function
function GenerateQr() {

 // Apply if Condition=> taki agr input empty h to vo image ka icon show na kre
 if(qrText.value.length > 0){   //it means in input field there shoulb be any value
// qrImage.src => Api link copy ki and uske last data= {Hello} remove + qrText.value, jo ham type kre uska qr make
// Call function and add onclick to button and pass function
    qrImage.src = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + qrText.value;

    qrBox.classList.add("show-img")
 }
 else {   //if no value in input than error runs, usme animation chlega move hoga left to right for 1s ten times
    qrText.classList.add('error');
    setTimeout(()=>{
    qrText.classList.remove('error');
    } , 1000)     //timeout after sometime it removes
 }
}

GenerateQr();
    </script>
</body>
</html>
